services:
  - type: web
    name: raftlabs-backend
    env: node
    plan: free
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npx prisma db seed && npm run start:prod
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: raftlabs-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: "*"
databases:
  - name: raftlabs-db
    plan: free
    databaseName: raftlabs
    user: raftlabs
